[pytest]
minversion = 7.0
testpaths = tests
# --junitxml is pytest's built-in machine-readable report; the HTML report is produced
# by framework/report.py (no third-party reporting plugin required).
addopts = -ra --strict-markers --junitxml=reports/junit.xml
filterwarnings =
    ignore::DeprecationWarning
markers =
    plan(*ids): TEST_PLAN.md identifiers covered by the test (e.g. AUTH-01, TICKET-09)
    api: HTTP contract / backend tests (requests)
    ui: browser tests (Playwright)
    e2e: full user journeys across pages (Playwright + API)
    security: security-related checks
    concurrency: parallel-request checks
    slow: tests that move a lot of data or build large graphs
    needs_vue: UI test that requires Vue/Sortable (served from vendor/ or CDN)
    needs_local_server: test needs direct DB/filesystem access (skipped against BASE_URL)
    known_issue: asserts the INTENDED contract of a defect found in the current build (xfail, non-strict)
    characterization: documents the CURRENT behaviour where the plan leaves the contract open
